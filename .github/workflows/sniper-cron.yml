name: GiftKit 24/7 Cloud Sniper Cron

on:
  schedule:
    # Runs every 5 minutes 24/7 on GitHub servers (no laptop needed)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sniper-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger GiftKit Cloud Sniper Tick
        run: |
          echo "Triggering GiftKit 24/7 cloud sniper tick..."
          curl -fsS --max-time 50 "https://giftkit-ten.vercel.app/api/cron/sniper-tick"
          echo ""
